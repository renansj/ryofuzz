name: Release

# Release on an explicit tag push (v1.2.3) or manual dispatch. This replaces
# the previous "release on every push to main" trigger, which auto-bumped the
# version, tagged, and pushed back to main on each commit (review H3). Cutting
# a release is now a deliberate act: `git tag v1.2.3 && git push origin v1.2.3`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.2.3)'
        required: true

permissions:
  contents: write
  id-token: write # required for cosign keyless signing

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify dependencies
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o /dev/null .
      - name: Test
        run: go test ./... -race -timeout 120s

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing $VERSION"

      - name: Build binaries
        run: |
          VERSION=${{ steps.version.outputs.version }}
          LDFLAGS="-s -w -X main.version=$VERSION -X main.commit=$(git rev-parse --short HEAD) -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/ryofuzz-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/ryofuzz-linux-arm64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/ryofuzz-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/ryofuzz-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/ryofuzz-windows-amd64.exe .

      - name: Generate checksums
        run: cd dist && sha256sum * > checksums.txt

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/ryofuzz.sbom.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign checksums (keyless)
        run: |
          cosign sign-blob --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            dist/checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/ryofuzz-linux-amd64
            dist/ryofuzz-linux-arm64
            dist/ryofuzz-darwin-amd64
            dist/ryofuzz-darwin-arm64
            dist/ryofuzz-windows-amd64.exe
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/checksums.txt.pem
            dist/ryofuzz.sbom.spdx.json
