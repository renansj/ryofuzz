name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    # Advisory only - offensive security tools intentionally use patterns
    # that static analyzers flag (InsecureSkipVerify, unhandled errors in
    # HTTP writes, permissive file modes for reports, etc.)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: govulncheck (dependency vulnerabilities)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true

      - name: gosec (static analysis)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude=G101,G104,G304,G306,G402,G501 -severity medium ./... || true

      - name: go vet
        run: go vet ./...

      - name: Build verification
        run: go build -o /dev/null .
